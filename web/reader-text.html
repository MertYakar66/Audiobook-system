<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d1117">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Scriptum - Reader</title>
    <link rel="stylesheet" href="reader-text.css?v=6">
</head>

<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <a href="library.html" class="header-btn" title="Back to Library">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20"
                        height="20">
                        <line x1="19" y1="12" x2="5" y2="12" />
                        <polyline points="12 19 5 12 12 5" />
                    </svg>
                </a>
                <h1 id="book-title">Loading...</h1>
            </div>
            <div class="header-right">
                <!-- Sidebar toggle -->
                <button id="sidebar-btn" class="header-btn" title="Notes & Highlights">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20"
                        height="20">
                        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- Chapter Navigation -->
        <div class="chapter-nav">
            <button id="prev-chapter" class="chapter-btn" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                    <polyline points="15 18 9 12 15 6" />
                </svg>
            </button>
            <select id="chapter-select"></select>
            <button id="next-chapter" class="chapter-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                    <polyline points="9 18 15 12 9 6" />
                </svg>
            </button>
        </div>

        <!-- Annotation Toolbar -->
        <div class="annotation-toolbar" id="annotation-toolbar">
            <div class="tool-colors">
                <button class="tool-color selected" data-color="yellow" style="background: #fff59d" title="Yellow"></button>
                <button class="tool-color" data-color="green" style="background: #c8e6c9" title="Green"></button>
                <button class="tool-color" data-color="blue" style="background: #bbdefb" title="Blue"></button>
                <button class="tool-color" data-color="pink" style="background: #f8bbd9" title="Pink"></button>
                <button class="tool-color" data-color="orange" style="background: #ffcc80" title="Orange"></button>
            </div>
            <div class="tool-divider"></div>
            <div class="tool-buttons">
                <button class="tool-btn" id="tool-highlight" data-tool="highlight" title="Highlight sentences">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                    <span>Highlight</span>
                </button>
                <button class="tool-btn" id="tool-note" data-tool="note" title="Add note to sentence">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                    <span>Note</span>
                </button>
                <button class="tool-btn" id="tool-eraser" data-tool="eraser" title="Remove highlight">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M20 20H7L3 16l7-7 10 10z"/><path d="M6 11l7-7 5 5"/><line x1="18" y1="20" x2="22" y2="20"/></svg>
                    <span>Eraser</span>
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <main class="content" id="content">
            <!-- Loading State -->
            <div id="loading-state" class="state-view">
                <div class="loader"></div>
                <p>Loading book...</p>
            </div>

            <!-- Error State -->
            <div id="error-state" class="state-view" style="display: none;">
                <h2>Could not load book</h2>
                <p id="error-message"></p>
                <a href="library.html" class="primary-btn">Back to Library</a>
            </div>

            <!-- Text Content -->
            <div id="text-content" class="text-content" style="display: none;"></div>
        </main>

        <!-- Sidebar Overlay + Panel -->
        <div id="sidebar-overlay" class="sidebar-overlay"></div>
        <div id="sidebar" class="sidebar">
            <div class="sidebar-inner">
                <div class="sidebar-header">
                    <h2>Notes & Highlights</h2>
                    <button id="close-sidebar" class="close-btn-round">&times;</button>
                </div>

                <!-- Tabs -->
                <div class="panel-tabs">
                    <button class="panel-tab active" data-tab="highlights">Highlights</button>
                    <button class="panel-tab" data-tab="notes">Notes</button>
                </div>

                <!-- Highlights tab -->
                <div id="highlights-tab" class="tab-content active">
                    <div id="highlights-list" class="annotation-list">
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="36"
                                height="36">
                                <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
                            </svg>
                            <p>No highlights yet</p>
                            <span>Use the toolbar above, then click sentences</span>
                        </div>
                    </div>
                </div>

                <!-- Notes tab -->
                <div id="notes-tab" class="tab-content">
                    <div id="notes-list" class="annotation-list">
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="36"
                                height="36">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                                <polyline points="14 2 14 8 20 8" />
                                <line x1="16" y1="13" x2="8" y2="13" />
                                <line x1="16" y1="17" x2="8" y2="17" />
                            </svg>
                            <p>No notes yet</p>
                            <span>Use the Note tool, then click a sentence</span>
                        </div>
                    </div>
                </div>

                <!-- Export -->
                <div class="sidebar-footer">
                    <button id="export-btn" class="export-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16"
                            height="16">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <polyline points="7 10 12 15 17 10" />
                            <line x1="12" y1="15" x2="12" y2="3" />
                        </svg>
                        Export All
                    </button>
                </div>
            </div>
        </div>

        <!-- Note Modal -->
        <div id="note-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Add Note</h2>
                    <button id="close-note-modal" class="close-btn-round">&times;</button>
                </div>
                <div id="selected-text-preview" class="selected-text-preview"></div>
                <textarea id="note-input" class="note-textarea" placeholder="Write your note here..."></textarea>
                <div class="modal-color-picker">
                    <span class="color-label">Color:</span>
                    <div class="color-options">
                        <button class="color-pick-btn selected" data-color="yellow" style="background: #fff59d"
                            title="Yellow"></button>
                        <button class="color-pick-btn" data-color="green" style="background: #c8e6c9"
                            title="Green"></button>
                        <button class="color-pick-btn" data-color="blue" style="background: #bbdefb"
                            title="Blue"></button>
                        <button class="color-pick-btn" data-color="pink" style="background: #f8bbd9"
                            title="Pink"></button>
                        <button class="color-pick-btn" data-color="orange" style="background: #ffcc80"
                            title="Orange"></button>
                    </div>
                </div>
                <div class="modal-actions">
                    <button id="save-note" class="primary-btn">Save Note</button>
                    <button id="highlight-only" class="secondary-btn">Highlight Only</button>
                </div>
            </div>
        </div>

        <!-- Toast -->
        <div id="toast" class="toast"></div>
    </div>

    <script src="reader-text.js?v=6"></script>
</body>

</html>
